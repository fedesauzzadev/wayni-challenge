name: bcra-microservices

services:
  postgres:
    # PG17 por el streaming I/O de seq scans (automático, sin GUC): la agregación y los índices
    # escanean varias veces los ~2.5 GB de staging — ADR-013. Requiere reprovisionar pgdata
    # (docker volume rm bcra-microservices_pgdata) al venir de 16.x.
    image: postgres:17.5-alpine
    container_name: bcra-postgres
    # VACUUM paralelo (post-import) usa dynamic shared memory: el default de 64MB de /dev/shm
    # hace fallar el VACUUM (ANALYZE) sobre tablas de ~20M filas con "No space left on device".
    shm_size: 1gb
    # Tuning de bulk-load del pipeline de import (mediciones y decisión en ADR-011/ADR-013):
    # shared_buffers y checkpoint pacing para el bulk (max_wal_size/checkpoint_timeout),
    # wal_compression=lz4 recorta los full-page images del WAL que genera cargar ~4 GB por
    # import y synchronous_commit=off elimina el fsync de los 172 commits de lote (seguro para
    # el protocolo: lote+checkpoint se pierden juntos, el takeover retoma del checkpoint
    # anterior — solo aceptable en dev). El streaming I/O de seq scans de PG17 no requiere GUC.
    # El work_mem/maintenance_work_mem de las fases largas NO van acá: son session-scoped en
    # DapperImportJobRepository para no afectar otras queries.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - max_wal_size=8GB
      - -c
      - checkpoint_timeout=30min
      - -c
      - wal_compression=lz4
      - -c
      - synchronous_commit=off
      - -c
      - max_parallel_maintenance_workers=4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bcra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env before starting}
      POSTGRES_DB: ${POSTGRES_DB:-bcra}
    ports:
      - "${POSTGRES_PORT:-5544}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - bcra

  localstack:
    image: localstack/localstack:3.8.1
    container_name: bcra-localstack
    environment:
      SERVICES: sqs,s3
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-bcra-local}
      DEBUG: ${LOCALSTACK_DEBUG:-0}
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./localstack/init:/etc/localstack/init/ready.d
    networks:
      - bcra

  ingestion-api:
    build:
      context: .
      dockerfile: src/services/Dockerfile
      args:
        SERVICE: ingestion
        PROJECT: Bcra.Ingestion
    container_name: bcra-ingestion-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Database__ConnectionString: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-bcra};Username=${POSTGRES_USER:-bcra};Password=${POSTGRES_PASSWORD};MaxPoolSize=${DATABASE_MAXPOOLSIZE:-50};Max Auto Prepare=${DATABASE_MAXAUTOPREPARE:-16}"
      Database__ReadonlyPassword: ${POSTGRES_READONLY_PASSWORD}
      Ingestion__BatchSize: ${INGESTION_BATCH_SIZE:-200000}
      Ingestion__AllowedSourceDirs: "/data,/data-vol"
      Ingestion__AllowedS3Buckets: ${S3_BUCKET:-bcra-local}
      Sqs__ImportCompletedQueueUrl: ${SQS_IMPORT_COMPLETED_URL:-}
      Upload__ApiKey: ${UPLOAD_API_KEY}
      AWS__EndpointUrl: "http://localstack:4566"
      AWS__Region: ${AWS_REGION:-us-east-1}
      AWS__AccessKeyId: ${AWS_ACCESS_KEY_ID:-test}
      AWS__SecretAccessKey: ${AWS_SECRET_ACCESS_KEY:-test}
    ports:
      - "${INGESTION_API_PORT:-18080}:8080"
    volumes:
      - ${DATA_DIR:-./samples}:/data:ro
      # Volumen nativo del VM para el archivo grande: el bind mount de Windows sirve /data a
      # ~80 MB/s medidos (5.6 GB ≈ 69 s solo de lectura), el volumen a velocidad de disco del VM.
      # Se carga con scripts/stage-source.mjs (docker cp) — ADR-013. rw porque docker cp escribe
      # a través del filesystem del contenedor.
      - source-data:/data-vol
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bcra

  query-api:
    build:
      context: .
      dockerfile: src/services/Dockerfile
      args:
        SERVICE: query
        PROJECT: Bcra.Query
    container_name: bcra-query-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Database__ConnectionString: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-bcra};Username=bcra_readonly;Password=${POSTGRES_READONLY_PASSWORD};MaxPoolSize=${DATABASE_MAXPOOLSIZE:-50};Max Auto Prepare=${DATABASE_MAXAUTOPREPARE:-16}"
      Query__TopMax: ${QUERY_TOP_MAX:-100}
    ports:
      - "${QUERY_API_PORT:-18081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ingestion-api:
        condition: service_started
    networks:
      - bcra

  mailpit:
    image: axllent/mailpit:v1.32
    container_name: bcra-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - bcra

  notifier-api:
    build:
      context: .
      dockerfile: src/services/Dockerfile
      args:
        SERVICE: notifier
        PROJECT: Bcra.Notifier
    container_name: bcra-notifier-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Database__ConnectionString: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-bcra};Username=bcra_readonly;Password=${POSTGRES_READONLY_PASSWORD};MaxPoolSize=5"
      AWS__EndpointUrl: "http://localstack:4566"
      AWS__Region: ${AWS_REGION:-us-east-1}
      AWS__AccessKeyId: ${AWS_ACCESS_KEY_ID:-test}
      AWS__SecretAccessKey: ${AWS_SECRET_ACCESS_KEY:-test}
      Sqs__ImportCompletedQueueUrl: ${SQS_IMPORT_COMPLETED_URL:-}
      Notifications__WebhookUrl: ${WEBHOOK_URL:-}
      Notifications__Email__To: ${NOTIFICATIONS__EMAIL__TO:-fede.sauzza.dev@gmail.com}
      Notifications__Email__Host: ${SMTP_HOST:-mailpit}
      Notifications__Email__Port: ${SMTP_PORT:-1025}
      Notifications__Email__EnableSsl: ${SMTP_SSL:-false}
      Notifications__Email__Username: ${SMTP_USER:-}
      Notifications__Email__Password: ${SMTP_PASSWORD:-}
    ports:
      - "${NOTIFIER_API_PORT:-18082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started
      mailpit:
        condition: service_started
    networks:
      - bcra

  prometheus:
    image: prom/prometheus:v3.4.2
    container_name: bcra-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - bcra

  grafana:
    image: grafana/grafana:12.0.2
    container_name: bcra-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    networks:
      - bcra

volumes:
  pgdata:
  source-data:
  localstack-data:
  prometheus-data:
  grafana-data:

networks:
  bcra:
    driver: bridge



