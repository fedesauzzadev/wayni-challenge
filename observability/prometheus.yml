global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ingestion
    static_configs:
      - targets: ["ingestion-api:8080"]

  - job_name: query
    static_configs:
      - targets: ["query-api:8080"]

  - job_name: notifier
    static_configs:
      - targets: ["notifier-api:8080"]
